<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application - CareerConnect</title>
</head>

<body>

    <header>
        <h1>CareerConnect</h1>
        <p>Apply for your next career opportunity.</p>

        <nav>
            <a href="index.html">Home</a> |
            <a href="jobs.html">Jobs</a> |
            <a href="companies.html">Companies</a> |
            <a href="about.html">About</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>


    <main>

        <h2>Job Application Form</h2>

        <form action="#" method="post">

            <!-- Personal Information -->
            <fieldset>

                <legend>Personal Information</legend>

                <p>
                    <label for="fullName">Full Name:</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        required
                    >
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </p>

                <p>
                    <label for="phone">Phone:</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        required
                    >
                </p>

            </fieldset>


            <!-- Professional Information -->
            <fieldset>

                <legend>Professional Information</legend>

                <p>
                    <label for="resume">Resume:</label>
                    <input
                        type="file"
                        id="resume"
                        name="resume"
                        accept=".pdf,.doc,.docx"
                    >
                </p>

                <p>
                    <label for="skills">Skills:</label>
                    <textarea
                        id="skills"
                        name="skills"
                        rows="4"
                        cols="40"
                        placeholder="Example: JavaScript, React, Node.js, MongoDB"
                    ></textarea>
                </p>

                <p>
                    <label for="experience">Experience:</label>

                    <select id="experience" name="experience">

                        <option value="">
                            Select Experience
                        </option>

                        <option value="fresher">
                            Fresher
                        </option>

                        <option value="0-1">
                            0-1 Years
                        </option>

                        <option value="1-3">
                            1-3 Years
                        </option>

                        <option value="3+">
                            3+ Years
                        </option>

                    </select>
                </p>

            </fieldset>


            <!-- Application Information -->
            <fieldset>

                <legend>Application Information</legend>

                <p>
                    <label for="position">Position:</label>

                    <select id="position" name="position" required>

                        <option value="">
                            Select Position
                        </option>

                        <option value="mern-developer">
                            MERN Stack Developer
                        </option>

                        <option value="frontend-developer">
                            Frontend Developer
                        </option>

                        <option value="backend-developer">
                            Backend Developer
                        </option>

                        <option value="software-intern">
                            Software Developer Intern
                        </option>

                    </select>
                </p>

                <p>
                    <label for="location">Preferred Location:</label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Example: Pune"
                    >
                </p>

                <p>
                    <label for="workMode">Work Mode:</label>

                    <select id="workMode" name="workMode">

                        <option value="">
                            Select Work Mode
                        </option>

                        <option value="remote">
                            Remote
                        </option>

                        <option value="office">
                            Office
                        </option>

                        <option value="hybrid">
                            Hybrid
                        </option>

                    </select>
                </p>

                <p>
                    <label for="coverLetter">Cover Letter:</label>
                    <textarea
                        id="coverLetter"
                        name="coverLetter"
                        rows="7"
                        cols="50"
                        placeholder="Write your cover letter..."
                    ></textarea>
                </p>

            </fieldset>


            <!-- Consent -->
            <fieldset>

                <legend>Consent</legend>

                <p>
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the Terms and Conditions.
                    </label>
                </p>

                <p>
                    <input
                        type="checkbox"
                        id="privacy"
                        name="privacy"
                        required
                    >

                    <label for="privacy">
                        I agree to the Privacy Policy.
                    </label>
                </p>

            </fieldset>


            <!-- Submit -->
            <p>
                <button type="submit">
                    Submit Application
                </button>

                <button type="reset">
                    Reset
                </button>
            </p>

        </form>

    </main>


    <footer>

        <p>
            &copy; 2026 CareerConnect. All rights reserved.
        </p>

    </footer>

</body>

</html>
